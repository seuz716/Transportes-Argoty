<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argoty — Liquidacion de Fletes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:480px;margin:0 auto;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
h1{font-size:1.3rem;margin:8px 0;text-align:center}
h2{font-size:1.1rem;margin:12px 0 8px;color:#1a73e8}
h3{font-size:1rem;margin:8px 0 4px}
#pin-screen{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;min-height:80vh}
#pin-screen input{font-size:1.6rem;text-align:center;letter-spacing:8px;width:200px;padding:12px;border:2px solid #1a73e8;border-radius:12px;outline:none}
#pin-screen input:focus{border-color:#1557b0}
#pin-screen button{width:100%;max-width:200px;padding:12px;font-size:1.1rem;background:#1a73e8;color:#fff;border:none;border-radius:12px;cursor:pointer}
#pin-screen button:active{background:#1557b0}
#pin-error{color:#d93025;font-size:.9rem;display:none}
#main-screen{display:none}
#alertas-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem;display:none}
#alertas-banner.visible{display:block}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.97)}
.card.selected{border:2px solid #1a73e8;background:#e8f0fe}
.card .cat-name{font-size:.85rem;font-weight:600;color:#5f6368}
.card .cat-monto{font-size:1.1rem;font-weight:700;color:#1a73e8;margin-top:4px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:#5f6368;margin-bottom:2px}
.form-group input,.form-group select{width:100%;padding:10px;font-size:1rem;border:1px solid #dadce0;border-radius:8px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#1a73e8}
.row{display:flex;gap:8px}
.btn{padding:10px 16px;font-size:.95rem;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#1a73e8;color:#fff;width:100%}
.btn-primary:active{background:#1557b0}
.btn-danger{background:#d93025;color:#fff}
.btn-success{background:#1e8e3e;color:#fff}
.btn-secondary{background:#5f6368;color:#fff}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}
.summary{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.summary .row{display:flex;justify-content:space-between;padding:4px 0;font-size:.95rem}
.summary .row.total{border-top:2px solid #dadce0;margin-top:8px;padding-top:8px;font-weight:700;font-size:1.1rem}
.summary .row.balance{color:#1e8e3e}
.summary .row.balance.negative{color:#d93025}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #dadce0}
.tab{flex:1;text-align:center;padding:8px;font-size:.9rem;font-weight:600;color:#5f6368;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#1a73e8;border-bottom-color:#1a73e8}
.tab-content{display:none}
.tab-content.active{display:block}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.compare-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:center;font-size:.85rem}
.compare-card .val{font-size:1.2rem;font-weight:700}
.compare-card .label{color:#5f6368;font-size:.75rem}
#ai-container{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#ai-response{background:#f8f9fa;border-radius:8px;padding:10px;font-size:.9rem;min-height:40px;max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-top:8px}
#ai-response:empty::before{content:"Escriba una pregunta...";color:#9aa0a6}
.expense-item{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:.9rem}
.expense-item:last-child{border-bottom:none}
.expense-item .desc{flex:1}
.expense-item .amt{font-weight:600;min-width:80px;text-align:right}
.expense-item .cat{color:#9aa0a6;font-size:.75rem}
.expense-item.addition{background:#fffde7}
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.date-row input[type="date"]{flex:1;padding:8px;font-size:.9rem;border:1px solid #dadce0;border-radius:8px}
.today-btn{padding:8px 12px;background:#e8f0fe;border:1px solid #1a73e8;border-radius:8px;font-size:.85rem;color:#1a73e8;cursor:pointer;white-space:nowrap}
.footer{margin-top:16px;padding:12px;text-align:center;font-size:.75rem;color:#9aa0a6}
.hidden{display:none!important}

/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999}
#loading-overlay.hidden{display:none}
.loading-dialog{background:#fff;padding:20px 28px;border-radius:12px;text-align:center;min-width:100px}
.loading-dialog .spinner{width:28px;height:28px;border:3px solid #dadce0;border-top-color:#1a73e8;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px}
.loading-dialog p{font-size:.85rem;color:#5f6368}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="pin-screen">
  <h1>Argoty</h1>
  <p style="color:#5f6368;font-size:.9rem">Liquidacion de fletes</p>
  <input type="password" id="pin-input" placeholder="PIN" maxlength="6" inputmode="numeric" autocomplete="off">
  <button id="pin-submit">Ingresar</button>
  <p id="pin-error">PIN incorrecto</p>
</div>

<div id="main-screen">
  <div id="alertas-banner"></div>

  <div id="nuevo-viaje" class="hidden">
    <h2>Abrir nuevo viaje</h2>
    <div class="form-group">
      <label>Placa del vehiculo</label>
      <input type="text" id="viaje-placa" placeholder="Ej: SAV-792" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Fecha de inicio</label>
      <input type="date" id="viaje-fecha">
    </div>
    <div class="form-group">
      <label>Kilometro inicial</label>
      <input type="number" id="viaje-km-inicial" placeholder="0" min="0" step="1">
    </div>
    <button class="btn btn-primary" id="btn-crear-viaje">Abrir viaje</button>
  </div>

  <div id="app-content" class="hidden">
    <h2>Nuevo Gasto</h2>
    <div class="cards-grid" id="categorias-grid"></div>

    <div class="form-group">
      <label>Fecha</label>
      <div class="date-row">
        <input type="date" id="gasto-fecha">
        <button type="button" class="today-btn" id="btn-hoy">Hoy</button>
      </div>
    </div>
    <div class="form-group">
      <label>Descripcion</label>
      <input type="text" id="gasto-descripcion" placeholder="Ej: Gasolina, peaje..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Monto ($)</label>
      <input type="number" id="gasto-monto" placeholder="0" step="1000" min="0">
    </div>
    <button class="btn btn-primary" id="btn-agregar-gasto">Agregar gasto</button>

    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-danger" id="btn-cerrar">Cerrar viaje</button>
      <button class="btn btn-secondary" id="btn-limpiar">Limpiar</button>
    </div>

    <div id="km-final-dialog" class="hidden" style="margin-top:12px">
      <div class="summary">
        <h3 style="margin-bottom:8px">Kilometro final</h3>
        <div class="form-group">
          <input type="number" id="viaje-km-final" placeholder="Km final" min="0" step="1">
        </div>
        <p id="km-final-error" style="color:#d93025;font-size:.85rem;display:none"></p>
        <div class="btn-row">
          <button class="btn btn-danger" id="btn-confirmar-cierre">Cerrar viaje</button>
          <button class="btn btn-secondary" id="btn-cancelar-cierre">Cancelar</button>
        </div>
      </div>
    </div>

     <div class="tabs" style="margin-top:20px">
       <div class="tab active" data-tab="resumen">Resumen</div>
       <div class="tab" data-tab="gastos">Gastos</div>
       <div class="tab" data-tab="fletes">Fletes</div>
       <div class="tab" data-tab="bitacora">Bitacora</div>
       <div class="tab" data-tab="comparar">Comparar</div>
     </div>

     <div class="tab-content active" id="tab-resumen">
       <div class="summary" id="resumen-resumen"></div>
     </div>
     <div class="tab-content" id="tab-gastos">
       <div id="lista-gastos"></div>
     </div>
     <div class="tab-content" id="tab-fletes">
       <div id="lista-fletes"></div>
     </div>
     <div class="tab-content" id="tab-bitacora">
       <div class="summary">
         <h3 style="margin-bottom:8px">Bitacora del viaje</h3>
         <div class="form-group">
           <label>Nota</label>
           <input type="text" id="bitacora-nota" placeholder="Observacion..." autocomplete="off">
         </div>
         <div class="form-group">
           <label>Monto opcional ($)</label>
           <input type="number" id="bitacora-monto" placeholder="0" step="1000" min="0">
         </div>
         <button class="btn btn-primary" id="btn-agregar-bitacora">Agregar</button>
         <div id="lista-bitacora" style="margin-top:12px"></div>
       </div>
     </div>
     <div class="tab-content" id="tab-comparar">
       <div class="compare-grid" id="compare-grid"></div>
     </div>

    <div id="ai-container">
      <h3>Asistente IA</h3>
      <div class="row">
        <input type="text" id="ia-pregunta" placeholder="Pregunte algo..." autocomplete="off" style="flex:1">
        <button class="btn btn-secondary" id="btn-ia" style="flex:0;white-space:nowrap">Preguntar</button>
      </div>
      <div id="ai-response"></div>
    </div>

    <div id="cerramiento-result" class="hidden" style="margin-top:16px">
      <h3>Viaje cerrado</h3>
      <div id="cerramiento-datos"></div>
      <a id="btn-pdf" href="#" target="_blank" class="btn btn-primary" style="display:block;text-align:center;margin-top:8px">Abrir PDF</a>
      <div class="btn-row" style="margin-top:8px">
        <a id="btn-wa" href="#" class="btn btn-success" style="text-align:center;flex:1" target="_blank">WhatsApp</a>
        <button id="btn-email" class="btn btn-secondary" style="flex:1">Enviar email</button>
      </div>
      <div id="email-dialog" class="hidden" style="margin-top:8px">
        <input type="email" id="email-dest" placeholder="email@ejemplo.com" style="width:100%;padding:8px;border-radius:8px;border:1px solid #dadce0;margin-bottom:4px">
        <button id="btn-enviar-email" class="btn btn-primary" style="width:100%">Enviar</button>
      </div>
    </div>

    <div class="footer">Transportes Argoty &copy; 2026</div>
  </div>
</div>

<div id="loading-overlay" class="hidden">
  <div class="loading-dialog">
    <div class="spinner"></div>
    <p id="loading-text">Cargando...</p>
  </div>
</div>

<script>
var ICONOS = {
  "Diario": "\u2615",
  "ACPM": "\u26FD",
  "Peajes": "\uD83D\uDEE3\uFE0F",
  "Comision": "\uD83D\uDCB0",
  "Comisi\u00f3n": "\uD83D\uDCB0",
  "Coteros": "\uD83D\uDE9A",
  "Descargue": "\uD83D\uDCE6",
  "Envarillada": "\uD83D\uDD27",
  "Manifiesto": "\uD83D\uDCCB",
  "Mantenimiento": "\uD83D\uDD29",
  "Otro": "\uD83D\uDCDD"
};

var GAS = {
  call: function(fn, args) {
    var token = localStorage.getItem("argoty_token") || "";
    args = args || [];
    args.push(token);
    return new Promise(function(resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  },
  pin: function(pin) { return GAS.call("verificarPIN", [pin]); },
  crearLiquidacion: function(placa, fechaInicio, kmInicial) { return GAS.call("crearLiquidacion", [placa, fechaInicio, kmInicial]); },
  agregarGasto: function(lid, cat, desc, monto, fecha, adicional) { return GAS.call("agregarGasto", [lid, cat, desc, monto, fecha, adicional]); },
  agregarFlete: function(lid, concepto, cliente, tipoCarga, monto) { return GAS.call("agregarFlete", [lid, concepto, cliente, tipoCarga, monto]); },
  cerrarLiquidacion: function(lid, kmFinal) { return GAS.call("cerrarLiquidacion", [lid, kmFinal]); },
  obtenerResumen: function(lid) { return GAS.call("obtenerResumenLiquidacion", [lid]); },
  comparar: function(idA, idB) { return GAS.call("compararLiquidaciones", [idA, idB]); },
  estadoVehiculo: function() { return GAS.call("obtenerEstadoVehiculo", []); },
  preguntarIA: function(preg, lid) { return GAS.call("preguntarIA", [preg, lid]); },
    enviarWhatsApp: function(lid, url) { return GAS.call("construirWhatsAppUrl", [lid, url]); },
  enviarEmail: function(dest, asunto, cuerpo, pdfUrl) { return GAS.call("enviarPorEmail", [dest, asunto, cuerpo, pdfUrl]); },
    obtenerCategorias: function() { return GAS.call("obtenerCategorias", []); },
    obtenerMontosSugeridos: function() { return GAS.call("obtenerMontosSugeridos", []); },
    agregarBitacora: function(lid, nota, monto) { return GAS.call("agregarBitacora", [lid, nota, monto]); },
    obtenerBitacora: function(lid) { return GAS.call("obtenerBitacora", [lid]); }
  };

var LIQUIDACION_ID = null;
var KM_INICIAL = null;
var cerraduraData = null;
var categoriaSeleccionada = null;
var _cachedResumen = null;
var _cachedResumenId = null;

function showLoading(texto) {
  document.getElementById("loading-text").textContent = texto || "Cargando...";
  document.getElementById("loading-overlay").classList.remove("hidden");
}
function hideLoading() {
  document.getElementById("loading-overlay").classList.add("hidden");
}

function escapeHtml(str) {
  if (!str) return "";
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function showScreen(name) {
  document.getElementById("pin-screen").style.display = name === "pin" ? "flex" : "none";
  document.getElementById("main-screen").style.display = name === "main" ? "block" : "none";
}

async function verifyPIN() {
  var pin = document.getElementById("pin-input").value;
  if (pin.length < 4) {
    document.getElementById("pin-error").textContent = "Minimo 4 digitos";
    document.getElementById("pin-error").style.display = "block";
    return;
  }
  try {
    var result = await GAS.pin(pin);
    if (result && result !== false) {
      localStorage.setItem("argoty_token", result);
      document.getElementById("pin-error").style.display = "none";
      openLiquidacion();
    } else {
      document.getElementById("pin-error").textContent = "PIN incorrecto";
      document.getElementById("pin-error").style.display = "block";
    }
  } catch (e) {
    document.getElementById("pin-error").textContent = "Error al verificar PIN";
    document.getElementById("pin-error").style.display = "block";
  }
}

async function openLiquidacion() {
  showScreen("main");
  showLoading("Cargando datos del viaje...");
  try {
    var resumen = await GAS.obtenerResumen("current");
    LIQUIDACION_ID = resumen.id;
    KM_INICIAL = resumen.kmInicial;
    document.getElementById("app-content").classList.remove("hidden");
    document.getElementById("nuevo-viaje").classList.add("hidden");
  } catch (e) {
    LIQUIDACION_ID = null;
    KM_INICIAL = null;
    document.getElementById("app-content").classList.add("hidden");
    document.getElementById("nuevo-viaje").classList.remove("hidden");
    document.getElementById("viaje-fecha").value = new Date().toISOString().split("T")[0];
  }
  _cachedResumen = null;
  loadCategorias();
  loadResumen();
  loadAlertas();
  hideLoading();
}

async function crearNuevoViaje() {
  var placa = document.getElementById("viaje-placa").value.trim();
  var fecha = document.getElementById("viaje-fecha").value;
  var kmInicial = parseInt(document.getElementById("viaje-km-inicial").value);
  if (!placa || !fecha || isNaN(kmInicial) || kmInicial < 0) {
    return alert("Complete todos los campos correctamente");
  }
  var btn = document.getElementById("btn-crear-viaje");
  btn.disabled = true;
  btn.textContent = "Abriendo...";
  try {
    await GAS.crearLiquidacion(placa, fecha, kmInicial);
    openLiquidacion();
  } catch (e) {
    alert("Error al crear viaje: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Abrir viaje";
  }
}

async function loadCategorias() {
  try {
    var cats = await GAS.obtenerCategorias();
    var sugeridos = await GAS.obtenerMontosSugeridos();
    var grid = document.getElementById("categorias-grid");
    grid.innerHTML = cats.map(function(c) {
      var icon = ICONOS[c.nombre] || "\uD83D\uDCCC";
      var monto = sugeridos[c.nombre] || 0;
      return '<div class="card" data-cat="' + escapeHtml(c.nombre) + '">' +
        '<div class="cat-name">' + icon + ' ' + escapeHtml(c.nombre) + '</div>' +
        '<div class="cat-monto">$' + monto.toLocaleString("es-CO") + '</div>' +
        '</div>';
    }).join("");
  } catch (e) {
    var fallback = [
      {nombre: "Diario"}, {nombre: "ACPM"}, {nombre: "Peajes"},
      {nombre: "Comision"}, {nombre: "Coteros"}, {nombre: "Descargue"},
      {nombre: "Envarillada"}, {nombre: "Manifiesto"}, {nombre: "Mantenimiento"}, {nombre: "Otro"}
    ];
    var grid = document.getElementById("categorias-grid");
    grid.innerHTML = fallback.map(function(c) {
      var icon = ICONOS[c.nombre] || "\uD83D\uDCCC";
      return '<div class="card" data-cat="' + c.nombre + '">' +
        '<div class="cat-name">' + icon + ' ' + c.nombre + '</div>' +
        '<div class="cat-monto">$0</div>' +
        '</div>';
    }).join("");
  }
}

function loadResumen() {
  if (!LIQUIDACION_ID) return;
  if (_cachedResumen && _cachedResumenId === LIQUIDACION_ID) {
    renderResumen(_cachedResumen);
    return;
  }
  GAS.obtenerResumen(LIQUIDACION_ID).then(function(res) {
    _cachedResumen = res;
    _cachedResumenId = LIQUIDACION_ID;
    renderResumen(res);
  }).catch(function(){});
}

function renderResumen(res) {
  var el = document.getElementById("resumen-resumen");
  var balCls = res.balance >= 0 ? "" : "negative";
  var balSign = res.balance >= 0 ? "+" : "";
  el.innerHTML =
    '<div class="row"><span>Viaje</span><span>' + escapeHtml(String(res.id)) + '</span></div>' +
    '<div class="row"><span>Vehiculo</span><span>' + escapeHtml(res.placa) + '</span></div>' +
    '<div class="row"><span>Km inicial</span><span>' + res.kmInicial + '</span></div>' +
    '<div class="row"><span>Gastos</span><span>$' + res.totalGastos.toLocaleString("es-CO") + '</span></div>' +
    '<div class="row"><span>Fletes</span><span>$' + res.totalFletes.toLocaleString("es-CO") + '</span></div>' +
    '<div class="row total ' + balCls + '"><span>Balance</span><span>' + balSign + '$' + res.balance.toLocaleString("es-CO") + '</span></div>';
}

function loadAlertas() {
  GAS.estadoVehiculo().then(function(alertas) {
    var banner = document.getElementById("alertas-banner");
    if (alertas.length > 0) {
      banner.classList.add("visible");
      banner.textContent = "\u26A0\uFE0F Mantenimiento pendiente: " + alertas.join(", ");
    } else {
      banner.classList.remove("visible");
    }
  }).catch(function(){});
}

async function agregarGasto() {
  var categoria = categoriaSeleccionada || "Otro";
  var fecha = document.getElementById("gasto-fecha").value;
  var desc = document.getElementById("gasto-descripcion").value;
  var monto = parseFloat(document.getElementById("gasto-monto").value);
  if (!fecha || !desc || !monto) return alert("Complete todos los campos");
  if (!LIQUIDACION_ID) return alert("Abra un viaje primero");
  var btn = document.getElementById("btn-agregar-gasto");
  btn.disabled = true;
  btn.textContent = "Agregando...";
  try {
    await GAS.agregarGasto(LIQUIDACION_ID, categoria, desc, monto, fecha, false);
    document.getElementById("gasto-descripcion").value = "";
    document.getElementById("gasto-monto").value = "";
    _cachedResumen = null;
    loadResumen();
    loadGastos();
  } catch (e) {
    alert("Error al agregar gasto: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Agregar gasto";
  }
}

function loadGastos() {
  if (!LIQUIDACION_ID) return;
  if (_cachedResumen && _cachedResumenId === LIQUIDACION_ID) {
    renderGastos(_cachedResumen);
    return;
  }
  GAS.obtenerResumen(LIQUIDACION_ID).then(function(res) {
    _cachedResumen = res;
    _cachedResumenId = LIQUIDACION_ID;
    renderGastos(res);
  }).catch(function(){});
}

function renderGastos(res) {
  var el = document.getElementById("lista-gastos");
  el.innerHTML = res.gastos.map(function(g) {
    var cls = g.esAdicional ? " addition" : "";
    return '<div class="expense-item' + cls + '">' +
      '<div><div class="desc">' + escapeHtml(g.descripcion) + '</div><div class="cat">' + escapeHtml(g.categoria) + ' \u2014 ' + escapeHtml(g.diaSemana) + '</div></div>' +
      '<div class="amt">$' + g.monto.toLocaleString("es-CO") + '</div></div>';
  }).join("");
}

function loadFletes() {
  if (!LIQUIDACION_ID) return;
  if (_cachedResumen && _cachedResumenId === LIQUIDACION_ID) {
    renderFletes(_cachedResumen);
    return;
  }
  GAS.obtenerResumen(LIQUIDACION_ID).then(function(res) {
    _cachedResumen = res;
    _cachedResumenId = LIQUIDACION_ID;
    renderFletes(res);
  }).catch(function(){});
}

function renderFletes(res) {
  var el = document.getElementById("lista-fletes");
  el.innerHTML = res.fletes.map(function(f) {
    return '<div class="expense-item">' +
      '<div><div class="desc">' + escapeHtml(f.concepto) + ' \u2014 ' + escapeHtml(f.cliente) + '</div><div class="cat">' + escapeHtml(f.tipoCarga) + '</div></div>' +
      '<div class="amt">$' + f.monto.toLocaleString("es-CO") + '</div></div>';
  }).join("");
}

function setupCerramientoHandlers() {
  document.getElementById("btn-email").addEventListener("click", function() {
    document.getElementById("email-dialog").classList.toggle("hidden");
  });
  document.getElementById("btn-enviar-email").addEventListener("click", function() {
    var dest = document.getElementById("email-dest").value.trim();
    if (!dest) return alert("Ingrese el email");
    showLoading("Enviando email...");
    GAS.enviarEmail(dest, "Liquidacion " + LIQUIDACION_ID, "Adjunto liquidacion " + LIQUIDACION_ID, cerraduraData.pdfUrl).then(function(msg) {
      alert(msg);
      hideLoading();
    }).catch(function(e) {
      alert("Error: " + e.message);
      hideLoading();
    });
  });
}

function showKmFinalDialog() {
  var dialog = document.getElementById("km-final-dialog");
  dialog.classList.remove("hidden");
  var input = document.getElementById("viaje-km-final");
  input.value = "";
  input.focus();
  document.getElementById("km-final-error").style.display = "none";
}

function hideKmFinalDialog() {
  document.getElementById("km-final-dialog").classList.add("hidden");
}

async function confirmarCierre() {
  var kmFinal = parseInt(document.getElementById("viaje-km-final").value);
  var errorEl = document.getElementById("km-final-error");
  if (isNaN(kmFinal) || kmFinal <= 0) {
    errorEl.textContent = "Ingrese un kilometro valido";
    errorEl.style.display = "block";
    return;
  }
  if (KM_INICIAL !== null && kmFinal <= KM_INICIAL) {
    errorEl.textContent = "El km final debe ser mayor al km inicial (" + KM_INICIAL + ")";
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";
  showLoading("Cerrando viaje...");
  var btnConfirm = document.getElementById("btn-confirmar-cierre");
  var btnCancelar = document.getElementById("btn-cancelar-cierre");
  btnConfirm.disabled = true;
  btnConfirm.textContent = "Cerrando...";
  btnCancelar.disabled = true;
  try {
    cerraduraData = await GAS.cerrarLiquidacion(LIQUIDACION_ID, kmFinal);
    hideKmFinalDialog();
    _cachedResumen = null;
    var resultDiv = document.getElementById("cerramiento-result");
    resultDiv.classList.remove("hidden");
    var datosDiv = document.getElementById("cerramiento-datos");
    var balCls = cerraduraData.balance >= 0 ? "" : "negative";
    datosDiv.innerHTML =
      '<div class="summary">' +
      '<div class="row"><span>Gastos</span><span>$' + cerraduraData.totalGastos.toLocaleString("es-CO") + '</span></div>' +
      '<div class="row"><span>Fletes</span><span>$' + cerraduraData.totalFletes.toLocaleString("es-CO") + '</span></div>' +
      '<div class="row total ' + balCls + '"><span>Balance</span><span>$' + cerraduraData.balance.toLocaleString("es-CO") + '</span></div>' +
      (cerraduraData.consumoKm ? '<div class="row"><span>Consumo ACPM</span><span>$' + cerraduraData.consumoKm.toFixed(2) + '/km</span></div>' : '') +
      '</div>';
    var waUrl = await GAS.enviarWhatsApp(cerraduraData.id, cerraduraData.pdfUrl || "");
    document.getElementById("btn-wa").href = waUrl;
    document.getElementById("btn-pdf").href = cerraduraData.pdfUrl || "#";
    if (!cerraduraData.pdfUrl) {
      document.getElementById("btn-pdf").style.display = "none";
      document.getElementById("btn-wa").style.display = "none";
    }
  } catch (e) {
    alert("Error al cerrar: " + e.message);
  } finally {
    hideLoading();
    btnConfirm.disabled = false;
    btnConfirm.textContent = "Cerrar viaje";
    btnCancelar.disabled = false;
  }
}

function init() {
  document.getElementById("pin-submit").addEventListener("click", verifyPIN);
  document.getElementById("pin-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") verifyPIN();
  });
  setupCerramientoHandlers();

  document.getElementById("btn-hoy").addEventListener("click", function() {
    var today = new Date().toISOString().split("T")[0];
    document.getElementById("gasto-fecha").value = today;
  });
  document.getElementById("gasto-fecha").value = new Date().toISOString().split("T")[0];

  document.getElementById("btn-crear-viaje").addEventListener("click", crearNuevoViaje);
  document.getElementById("btn-agregar-gasto").addEventListener("click", agregarGasto);
  document.getElementById("btn-cerrar").addEventListener("click", showKmFinalDialog);
  document.getElementById("btn-confirmar-cierre").addEventListener("click", confirmarCierre);
  document.getElementById("btn-cancelar-cierre").addEventListener("click", hideKmFinalDialog);
   document.getElementById("btn-limpiar").addEventListener("click", function() {
     document.getElementById("gasto-descripcion").value = "";
     document.getElementById("gasto-monto").value = "";
   });
   document.getElementById("btn-agregar-bitacora").addEventListener("click", agregarBitacora);

  document.getElementById("categorias-grid").addEventListener("click", function(e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var cat = card.dataset.cat;
    categoriaSeleccionada = cat;
    this.querySelectorAll(".card.selected").forEach(function(c) { c.classList.remove("selected"); });
    card.classList.add("selected");
    var montoText = card.querySelector(".cat-monto").textContent.replace("$", "").replace(/\./g, "").replace(/,/g, "");
    document.getElementById("gasto-monto").value = montoText;
    document.getElementById("gasto-descripcion").focus();
  });

  document.querySelectorAll(".tab").forEach(function(tab) {
    tab.addEventListener("click", function() {
      document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
      if (tab.dataset.tab === "gastos") loadGastos();
      if (tab.dataset.tab === "fletes") loadFletes();
      if (tab.dataset.tab === "bitacora") loadBitacora();
      if (tab.dataset.tab === "comparar") loadComparar();
    });
  });

  document.getElementById("btn-ia").addEventListener("click", function() {
    var preg = document.getElementById("ia-pregunta").value;
    if (!preg) return;
    showLoading("Consultando asistente IA...");
    var resp = document.getElementById("ai-response");
    resp.textContent = "Cargando...";
    GAS.preguntarIA(preg, LIQUIDACION_ID || "current").then(function(text) {
      resp.textContent = text;
      hideLoading();
    }).catch(function(e) {
      resp.textContent = "Error: " + e.message;
      hideLoading();
    });
  });
}

async function loadBitacora() {
  if (!LIQUIDACION_ID) return;
  GAS.obtenerBitacora(LIQUIDACION_ID).then(function(entries) {
    var el = document.getElementById('lista-bitacora');
    if (entries.length === 0) {
      el.innerHTML = '<p style="color:#9aa0a6;font-size:.85rem;text-align:center">Sin notas registradas</p>';
      return;
    }
    el.innerHTML = entries.slice().reverse().map(function(e) {
      var linea = '<div class="expense-item">' +
        '<div><div class="desc">' + escapeHtml(e.nota) +
        (e.montoOpcional ? ' <span class="cat">$'+ e.montoOpcional.toLocaleString("es-CO") +'</span>' : '') +
        '</div><div class="cat">' + escapeHtml(e.fecha) + '</div></div></div>';
      return linea;
    }).join('');
  }).catch(function(){});
}

async function agregarBitacora() {
  var nota = document.getElementById('bitacora-nota').value.trim();
  var monto = parseFloat(document.getElementById('bitacora-monto').value) || 0;
  if (!nota) return alert('Ingrese una nota');
  if (!LIQUIDACION_ID) return alert('Abra un viaje primero');
  try {
    await GAS.agregarBitacora(LIQUIDACION_ID, nota, monto);
    document.getElementById('bitacora-nota').value = '';
    document.getElementById('bitacora-monto').value = '';
    _cachedResumen = null;
    loadBitacora();
  } catch (e) {
    alert('Error al agregar nota: ' + e.message);
  }
}

function loadComparar() {
  GAS.comparar("current", "previous").then(function(res) {
    var grid = document.getElementById("compare-grid");
    grid.innerHTML =
      '<div class="compare-card"><div class="label">Viaje ' + escapeHtml(String(res.idA)) + '</div><div class="val">$' + res.balanceA.toLocaleString("es-CO") + '</div><div class="label">Balance</div></div>' +
      '<div class="compare-card"><div class="label">Viaje ' + escapeHtml(String(res.idB)) + '</div><div class="val">$' + res.balanceB.toLocaleString("es-CO") + '</div><div class="label">Balance</div></div>';
  }).catch(function() {
    document.getElementById("compare-grid").innerHTML = '<p style="color:#5f6368;text-align:center;font-size:.9rem">No hay viajes para comparar</p>';
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
