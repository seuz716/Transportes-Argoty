#pin-screen h1{font-size:1.6rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
#pin-screen p{color:rgba(255,255,255,0.8);font-size:.9rem}
#pin-card{background:rgba(255,255,255,0.12);backdrop-filter:blur(12px) saturate(180%);border:1px solid rgba(255,255,255,0.18);border-radius:16px;padding:32px 28px;width:100%;max-width:280px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
#pin-card input{font-size:1.6rem;text-align:center;letter-spacing:8px;width:100%;padding:12px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;outline:none;background:rgba(255,255,255,0.15);color:#fff;transition:border-color .2s}
#pin-card input:focus{border-color:var(--accent)}
#pin-card input::placeholder{color:rgba(255,255,255,0.4)}
#pin-card button{width:100%;padding:12px;font-size:1.1rem;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
#pin-card button:hover{transform:translateY(-1px);background:var(--accent-hover)}
#pin-card button:active{transform:scale(0.98)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#pin-error{color:var(--negative);font-size:.9rem;display:none}
#main-screen{display:none}
#alertas-banner{background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem;display:none}
#alertas-banner.visible{display:block}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.card{background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--card-shadow);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.97)}
.card.selected{border:2px solid var(--accent);background:var(--accent-subtle)}
.card .cat-name{font-size:.85rem;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.card .cat-name svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.card .cat-monto{font-size:1.1rem;font-weight:700;color:var(--accent);margin-top:4px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:2px}
.form-group input,.form-group select{width:100%;padding:10px;font-size:1rem;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--surface);color:var(--text)}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px}
.btn{padding:10px 16px;font-size:.95rem;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:background .15s,transform .1s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:active{background:#1557b0}
.btn-danger{background:var(--negative);color:#fff}
.btn-success{background:var(--positive);color:#fff}
.btn-secondary{background:var(--text-muted);color:#fff}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}
.summary{background:var(--surface);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.summary .row{display:flex;justify-content:space-between;padding:4px 0;font-size:.95rem}
.summary .row.total{border-top:2px solid var(--border);margin-top:8px;padding-top:8px;font-weight:700;font-size:1.1rem}
.summary .row.balance{color:var(--positive)}
.summary .row.balance.negative{color:var(--negative)}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--border)}
.tab{flex:1;text-align:center;padding:8px;font-size:.9rem;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.compare-card{background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--card-shadow);text-align:center;font-size:.85rem}
.compare-card .val{font-size:1.2rem;font-weight:700}
.compare-card .label{color:var(--text-muted);font-size:.75rem}
#ai-container{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:var(--card-shadow)}
#ai-response{background:var(--surface-raised);border-radius:8px;padding:10px;font-size:.9rem;min-height:40px;max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-top:8px}
#ai-response:empty::before{content:"Escriba una pregunta...";color:var(--text-faint)}
.expense-item{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border-light);font-size:.9rem}
.expense-item:last-child{border-bottom:none}
.expense-item .desc{flex:1}
.expense-item .amt{font-weight:600;min-width:80px;text-align:right}
.expense-item .cat{color:var(--text-faint);font-size:.75rem}
.expense-item.addition{background:var(--accent-subtle)}
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.date-row input[type="date"]{flex:1;padding:8px;font-size:.9rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.today-btn{padding:8px 12px;background:var(--accent-subtle);border:1px solid var(--accent);border-radius:8px;font-size:.85rem;color:var(--accent);cursor:pointer;white-space:nowrap}
.footer{margin-top:16px;padding:12px;text-align:center;font-size:.75rem;color:var(--text-faint)}
.hidden{display:none!important}

/* Sticky balance — hero */
#sticky-balance{position:sticky;top:0;z-index:100;margin-bottom:8px}
#balance-sticky .summary{cursor:pointer;border-left:3px solid var(--accent)}
#balance-sticky .summary .clickable{opacity:.7}
#balance-sticky .summary:hover{box-shadow:0 2px 6px rgba(0,0,0,.15)}
#sticky-balance .row span:last-child{font-family:var(--font-display);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
#sticky-balance .row .balance-amount{font-size:1.3rem}
#sticky-balance .row .balance-amount.negative{color:var(--negative)}

/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999}
#loading-overlay.hidden{display:none}
.loading-dialog{background:var(--surface);padding:20px 28px;border-radius:12px;text-align:center;min-width:100px}
.loading-dialog .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px}
.loading-dialog p{font-size:.85rem;color:var(--text-muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{top:-10px;opacity:1;transform:rotate(0deg) scale(1)}100%{top:100vh;opacity:0;transform:rotate(720deg) scale(.5)}}

/* Tab-content */
.tab-content{display:none;animation:none}
.tab-content.active{display:block;animation:tabFadeIn .25s ease-out}
@keyframes tabFadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

/* Auto-merged from styles.css */
.card .cat-suggest{font-size:.75rem;color:var(--text-faint);margin-top:2px}
.form-group select{background:var(--surface);-webkit-appearance:none}
.row .form-group{flex:1}
.compare-card.winner{background:var(--positive-subtle);border:2px solid var(--positive)}
.expense-list{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--card-shadow);margin-bottom:12px}

/* Toast */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;color:#fff;font-size:.85rem;z-index:9999;transition:opacity .3s;max-width:90vw;text-align:center}
.toast-error{background:var(--negative)}
.toast-success{background:var(--positive)}
.toast-info{background:#5f6368}

/* Targets táctiles 44×44px */
.expense-item button{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}

/* Spinner inline en botón */
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;margin-left:8px;vertical-align:middle}
.btn.loading .btn-spinner{display:inline-block}
.btn.loading .btn-text{opacity:.7}

/* Badge offline pendiente */
.offline-badge{font-size:.65rem;color:var(--negative);background:rgba(217,48,37,.1);padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.pending-item{opacity:.7}
.pending-item .desc::after{content:" ⏳";font-size:.75rem}

/* Dark mode toggle */
#theme-toggle{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text);padding:4px 8px;float:right;line-height:1;transition:transform .15s}
#theme-toggle:active{transform:scale(.9)}

/* Focus visible solo con teclado */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* Skeleton / offline */
.offline-indicator{text-align:center;padding:20px;color:var(--text-muted);font-size:.85rem}

@media (max-width:420px){
.app{padding:8px}
h1{font-size:1.2rem}
.tab{font-size:.75rem;padding:6px 4px}
.cards-grid{gap:5px}
.card{padding:8px}
.card .cat-name{font-size:.78rem}
.card .cat-monto{font-size:1rem}
.form-group{margin-bottom:8px}
.form-group input,.form-group select{padding:8px;font-size:.9rem}
.btn{padding:8px 12px;font-size:.85rem}
.expense-item{padding:8px 10px;font-size:.82rem}
.expense-item .amt{min-width:60px;font-size:.78rem}
.summary{padding:10px}
.summary .row{font-size:.85rem}
#pin-card{padding:24px 16px}
#sticky-balance .row span:last-child{font-size:1rem}
.compare-card{padding:8px}
.compare-card .val{font-size:1rem}
#ai-response{font-size:.82rem}
}
@media (max-width:340px){
.app{padding:4px}
h1{font-size:1.1rem}
.cards-grid{grid-template-columns:1fr}
.card{padding:6px}
.tab{font-size:.7rem;padding:4px 2px}
.btn{padding:6px 10px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="app">

<div id="pin-screen">
  <div id="pin-card">
    <h1>FLOTA YC</h1>
    <p>Liquidacion de fletes</p>
    <input type="password" id="pin-input" placeholder="PIN" maxlength="6" inputmode="numeric" autocomplete="off">
    <button id="pin-submit">Ingresar</button>
    <p id="pin-error" style="display:none;color:#ff8a80;font-size:.85rem;margin:0">PIN incorrecto</p>
  </div>
</div>

<div id="main-screen">

var GAS_QUEUE_KEY = "flota_offline_queue";
var GAS_TIMEOUT_MS = 15000;
var GAS_MAX_RETRIES = 3;
var _gasProcessing = false;

function _gasTimeout(ms) {
  return new Promise(function(_, reject) {
    setTimeout(function() { reject(new Error("Tiempo de espera agotado — revise su conexion")); }, ms);
  });
}

function _gasSaveQueue(queue) {
  localStorage.setItem(GAS_QUEUE_KEY, JSON.stringify(queue));
}

function _gasLoadQueue() {
  try { return JSON.parse(localStorage.getItem(GAS_QUEUE_KEY) || "[]"); } catch (e) { return []; }
}

function _gasProcessQueue() {
  if (_gasProcessing) return;
  var queue = _gasLoadQueue();
  if (queue.length === 0) return;

  _gasProcessing = true;
  var op = queue[0];

  GAS.call(op.fn, op.args).then(function() {
    var q = _gasLoadQueue();
    if (q.length > 0 && q[0].fn === op.fn && JSON.stringify(q[0].args) === JSON.stringify(op.args)) {
      q.shift();
      _gasSaveQueue(q);
    }
    _gasUpdatePendingCount();
    _gasProcessing = false;
    if (_gasLoadQueue().length > 0) _gasProcessQueue();
  }).catch(function(error) {
    console.warn("Operación fallida:", op.fn, error.message);
    var q = _gasLoadQueue();
    var idx = q.findIndex(function(item) {
      return item.fn === op.fn && JSON.stringify(item.args) === JSON.stringify(op.args);
    });
    if (idx === -1) {
      _gasProcessing = false;
      if (_gasLoadQueue().length > 0) _gasProcessQueue();
      return;
    }
    var retries = (q[idx].retries || 0) + 1;
    if (retries >= GAS_MAX_RETRIES) {
      q.splice(idx, 1);
      _gasSaveQueue(q);
      toast("Operación falló después de " + GAS_MAX_RETRIES + " intentos", "error");
      _gasProcessing = false;
      if (_gasLoadQueue().length > 0) _gasProcessQueue();
    } else {
      q[idx].retries = retries;
      _gasSaveQueue(q);
      _gasUpdatePendingCount();
      _gasProcessing = false;
    }
  });
}

function _gasUpdatePendingCount() {
  var count = _gasLoadQueue().length;
  var el = document.getElementById("pending-counter");
  if (!el) return;
  if (count > 0) {
    el.textContent = count + " pendiente" + (count > 1 ? "s" : "");
    el.title = "Operaciones pendientes de sincronización";
    el.style.display = "inline";
  } else {
    el.style.display = "none";
  }
}

function _gasQueueOperation(fn, args) {
  var queue = _gasLoadQueue();
  var existingIndex = queue.findIndex(function(op) {
    return op.fn === fn && JSON.stringify(op.args) === JSON.stringify(args);
  });
  
  if (existingIndex > -1) {
    // Actualizar la operación existente con nuevo timestamp
    queue[existingIndex].args = args;
    queue[existingIndex].ts = Date.now();
    queue[existingIndex].retries = 0;
  } else {
    queue.push({ fn: fn, args: args, ts: Date.now(), retries: 0 });
  }
  _gasSaveQueue(queue);
  _gasUpdatePendingCount();
}

function obtenerDeviceId() { if (!localStorage.getItem("flota_device_id")) localStorage.setItem("flota_device_id", (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).substr(2))); return localStorage.getItem("flota_device_id"); }

var GAS = {
  call: function(fn, args) {
    var token = localStorage.getItem("flota_token") || "";
    args = args || [];
    args.push(token);
    return Promise.race([
      new Promise(function(resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
      }),
      _gasTimeout(GAS_TIMEOUT_MS)
    ]).catch(function(err) {
      var isMutation = ["agregarGasto","agregarFlete","editarGasto","eliminarGasto","editarFlete","eliminarFlete","cerrarLiquidacion","agregarBitacora","convertirBitacoraAGasto","crearLiquidacion"].indexOf(fn) >= 0;
      if (isMutation) {
        var isNetworkErr = err.message.indexOf("Tiempo de espera") >= 0 || err.message.indexOf("Failed to fetch") >= 0 || err.message.indexOf("NetworkError") >= 0;
        if (isNetworkErr) {
          _gasQueueOperation(fn, args.slice(0, -1));
          return { queued: true, message: "Guardado sin conexion — se sincronizara cuando vuelva la señal" };
        }
        throw err;
      }
    });
  },
  pin: function(pin) { return GAS.call("verificarPIN", [pin, obtenerDeviceId()]); },
  crearLiquidacion: function(placa, fechaInicio, kmInicial, conductor) { return GAS.call("crearLiquidacion", [placa, fechaInicio, kmInicial, conductor]); },
  agregarGasto: function(lid, cat, desc, monto, fecha, adicional) { return GAS.call("agregarGasto", [lid, cat, desc, monto, fecha, adicional]); },
  agregarFlete: function(lid, concepto, cliente, tipoCarga, monto) { return GAS.call("agregarFlete", [lid, concepto, cliente, tipoCarga, monto]); },
  cerrarLiquidacion: function(lid, kmFinal) { return GAS.call("cerrarLiquidacion", [lid, kmFinal]); },
  obtenerResumen: function(lid) { return GAS.call("obtenerResumenLiquidacion", [lid]); },
  comparar: function(idA, idB) { return GAS.call("compararLiquidaciones", [idA, idB]); },
  estadoVehiculo: function() { return GAS.call("obtenerEstadoVehiculo", []); },
  obtenerKmActualVehiculo: function() { return GAS.call("obtenerKmActualVehiculo", []); },
  preguntarIA: function(preg, lid) { return GAS.call("preguntarIA", [preg, lid]); },
    enviarWhatsApp: function(lid, url) { return GAS.call("construirWhatsAppUrl", [lid, url]); },

  obtenerCategorias: function() { return GAS.call("obtenerCategorias", []); },
  obtenerMontosSugeridos: function() { return GAS.call("obtenerMontosSugeridos", []); },
  agregarBitacora: function(lid, nota, monto) { return GAS.call("agregarBitacora", [lid, nota, monto]); },
  obtenerBitacora: function(lid) { return GAS.call("obtenerBitacora", [lid]); },
  editarGasto: function(id, cat, desc, monto, fecha, adicional) { return GAS.call("editarGasto", [id, cat, desc, monto, fecha, adicional]); },
  eliminarGasto: function(id) { return GAS.call("eliminarGasto", [id]); },
  editarFlete: function(id, concepto, cliente, tipoCarga, monto) { return GAS.call("editarFlete", [id, concepto, cliente, tipoCarga, monto]); },
  eliminarFlete: function(id) { return GAS.call("eliminarFlete", [id]); },
  listarLiquidaciones: function() { return GAS.call("listarLiquidaciones", []); },
  convertirBitacoraAGasto: function(bitacoraId, categoria) { return GAS.call("convertirBitacoraAGasto", [bitacoraId, categoria]); }
  };

function showLoading(texto) {
  document.getElementById("loading-text").textContent = texto || "Cargando...";
  document.getElementById("loading-overlay").classList.remove("hidden");
}
function hideLoading() {
  document.getElementById("loading-overlay").classList.add("hidden");
}
function toast(msg, tipo) {
  tipo = tipo || "info";
  var t = document.createElement("div");
  t.className = "toast toast-" + tipo;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = "0"; }, 2500);
  setTimeout(function() { t.remove(); }, 2800);
}

function escapeHtml(str) {
  if (!str) return "";
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function showScreen(name) {
  document.getElementById("pin-screen").style.display = name === "pin" ? "flex" : "none";
  document.getElementById("main-screen").style.display = name === "main" ? "block" : "none";
}

async function verifyPIN() {
  var pin = document.getElementById("pin-input").value;
  if (pin.length < 4) {
    document.getElementById("pin-error").textContent = "Minimo 4 digitos";
    document.getElementById("pin-error").style.display = "block";
    return;
  }
  try {
    var result = await GAS.pin(pin);
    if (result && result !== false) {
      localStorage.setItem("flota_token", result);
      document.getElementById("pin-error").style.display = "none";
      openLiquidacion();
    } else {
      document.getElementById("pin-error").textContent = "PIN incorrecto";
      document.getElementById("pin-error").style.display = "block";
    }
  } catch (e) {
    document.getElementById("pin-error").textContent = "Error al verificar PIN";
    document.getElementById("pin-error").style.display = "block";
  }
}

async function openLiquidacion() {
  showScreen("main");
  showLoading("Cargando datos del viaje...");
  try {
    var resumen = await GAS.obtenerResumen("current");
    LIQUIDACION_ID = resumen.id;
    KM_INICIAL = resumen.kmInicial;
    document.getElementById("app-content").classList.remove("hidden");
    document.getElementById("nuevo-viaje").classList.add("hidden");
  } catch (e) {
    if (e.message && e.message.indexOf("Sesion expirada") >= 0) {
      toast("Sesión expirada — inicie sesión nuevamente", "error");
      localStorage.removeItem("flota_token");
      showScreen("pin");
    } else {
      LIQUIDACION_ID = null;
      KM_INICIAL = null;
      document.getElementById("app-content").classList.add("hidden");
      document.getElementById("nuevo-viaje").classList.remove("hidden");
      document.getElementById("viaje-fecha").value = new Date().toISOString().split("T")[0];
    }
  }
  _cachedResumen = null;
  loadCategorias();
  loadResumen();
  loadAlertas();
  hideLoading();
}

async function crearNuevoViaje() {
  var placa = document.getElementById("viaje-placa").value.trim();
  var fecha = document.getElementById("viaje-fecha").value;
  var conductor = document.getElementById("viaje-conductor").value.trim();
  var kmInicial = parseInt(document.getElementById("viaje-km-inicial").value);
  if (!placa || !fecha || isNaN(kmInicial) || kmInicial < 0) {
    return toast("Complete todos los campos correctamente", "error");
  }
  var btn = document.getElementById("btn-crear-viaje");
  btn.disabled = true;
  btn.textContent = "Abriendo...";
  try {
    await GAS.crearLiquidacion(placa, fecha, kmInicial, conductor);
    openLiquidacion();
  } catch (e) {
    toast("Error al crear viaje: " + e.message, "error");
  } finally {

function animateBalance(el, target, prefix, duration) {
  duration = duration || 800;
  var startTime = null;
  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    var eased = progress * (2 - progress);
    var current = Math.round(eased * target);
    el.textContent = prefix + '$' + current.toLocaleString("es-CO");
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

var COLORS_CELEBRAR = ["#c47a5a","#e8a87c","#f5d6c6","#388E3C","#81c784","#4fc3f7","#ffb74d","#ba68c8"];
function celebrar() {
  var c = document.createElement("div");
  c.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;overflow:hidden";
  for (var i = 0; i < 60; i++) {
    var p = document.createElement("div");
    var color = COLORS_CELEBRAR[Math.floor(Math.random() * COLORS_CELEBRAR.length)];
    var left = Math.random() * 100;
    var delay = Math.random() * 800;
    var size = 6 + Math.random() * 8;
    var rot = Math.random() * 360;
    p.style.cssText = "position:absolute;top:-10px;left:" + left + "%;width:" + size + "px;height:" + size + "px;background:" + color +
      ";border-radius:" + (Math.random() > 0.5 ? "50%" : "2px") + ";transform:rotate(" + rot + "deg);opacity:0;" +
      "animation:confettiFall " + (1.5 + Math.random()) + "s ease-out " + (delay/1000) + "s forwards";
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(function() { c.remove(); }, 3000);
}

async function confirmarCierre() {
  var kmFinal = parseInt(document.getElementById("viaje-km-final").value);
  var errorEl = document.getElementById("km-final-error");
  if (isNaN(kmFinal) || kmFinal <= 0) {
    errorEl.textContent = "Ingrese un kilometro valido";
    errorEl.style.display = "block";
    return;
  }
  if (KM_INICIAL !== null && kmFinal <= KM_INICIAL) {
    errorEl.textContent = "El km final debe ser mayor al km inicial (" + KM_INICIAL + ")";
    errorEl.style.display = "block";
    return;
  }
  if (KM_VEHICULO !== null && kmFinal < KM_VEHICULO) {
    errorEl.textContent = "El km final (" + kmFinal + ") no puede ser menor al km actual del vehiculo (" + KM_VEHICULO + ")";
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";
  showLoading("Cerrando viaje...");
  var btnConfirm = document.getElementById("btn-confirmar-cierre");
  var btnCancelar = document.getElementById("btn-cancelar-cierre");
  btnConfirm.disabled = true;
  btnConfirm.textContent = "Cerrando...";
  btnCancelar.disabled = true;
  try {
    cerraduraData = await GAS.cerrarLiquidacion(LIQUIDACION_ID, kmFinal);
    hideKmFinalDialog();
    _cachedResumen = null;
    var resultDiv = document.getElementById("cerramiento-result");
    resultDiv.classList.remove("hidden");
    var datosDiv = document.getElementById("cerramiento-datos");
    var balCls = cerraduraData.balance >= 0 ? "" : "negative";
    datosDiv.innerHTML =
      '<div class="summary">' +
      '<div class="row"><span>Gastos</span><span>$' + cerraduraData.totalGastos.toLocaleString("es-CO") + '</span></div>' +
      '<div class="row"><span>Fletes</span><span>$' + cerraduraData.totalFletes.toLocaleString("es-CO") + '</span></div>' +
      '<div class="row total ' + balCls + '"><span>Balance</span><span>$' + cerraduraData.balance.toLocaleString("es-CO") + '</span></div>' +
      (cerraduraData.consumoKm ? '<div class="row"><span>Consumo ACPM</span><span>$' + cerraduraData.consumoKm.toFixed(2) + '/km</span></div>' : '') +
      '</div>';
    var waUrl = await GAS.enviarWhatsApp(cerraduraData.id, cerraduraData.pdfUrl || "");
    document.getElementById("btn-wa").href = waUrl;
    document.getElementById("btn-pdf").href = cerraduraData.pdfUrl || "#";
    if (!cerraduraData.pdfUrl) {
      document.getElementById("btn-pdf").style.display = "none";
      document.getElementById("btn-wa").style.display = "none";
    }
    if (cerraduraData.balance > 0) {
      try { navigator.vibrate(200); } catch(e) {}
      celebrar();
    }
  } catch (e) {
    toast("Error al cerrar: " + e.message, "error");
  } finally {
    hideLoading();
    btnConfirm.disabled = false;
    btnConfirm.textContent = "Cerrar viaje";
    btnCancelar.disabled = false;
  }
}

function toggleTheme() {
  var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  document.getElementById("theme-toggle").textContent = next === "dark" ? "☀️" : "🌙";
}

function initTheme() {
  var saved = localStorage.getItem("theme");
  var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var theme = saved || preferred;
  document.documentElement.dataset.theme = theme;
  var b = document.getElementById("theme-toggle");
  if (b) b.textContent = theme === "dark" ? "☀️" : "🌙";
}

function setLoading(btn, loading) {
  if (!btn) return;
  if (loading) {
    btn.classList.add("loading");
    var spinner = btn.querySelector(".btn-spinner") || (function() { var s = document.createElement("span"); s.className = "btn-spinner"; btn.appendChild(s); return s; })();
    spinner.style.display = "inline-block";
    btn.disabled = true;
  } else {
    btn.classList.remove("loading");
    btn.querySelector(".btn-spinner").style.display = "none";
    btn.disabled = false;
  }
}

  document.getElementById("btn-agregar-bitacora").addEventListener("click", agregarBitacora);

  document.getElementById("categorias-grid").addEventListener("click", function(e) {
    var card = e.target.closest(".card");

    categoriaSeleccionada = cat;

    var montoText = card.querySelector(".cat-monto").textContent.replace("$", "").replace(/\./g, "").replace(/,/g, "");
    document.getElementById("gasto-monto").value = montoText;
    document.getElementById("gasto-descripcion").focus();
  });

  document.querySelectorAll(".tab").forEach(function(tab) {
    tab.addEventListener("click", function() {
      document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
      if (tab.dataset.tab === "gastos") loadGastos();
      if (tab.dataset.tab === "fletes") loadFletes();
      if (tab.dataset.tab === "bitacora") loadBitacora();
      if (tab.dataset.tab === "comparar") loadComparar();
    });
  });

  document.getElementById("btn-ia").addEventListener("click", function() {
    var preg = document.getElementById("ia-pregunta").value;
    if (!preg) return;
    showLoading("Consultando asistente IA...");
    var resp = document.getElementById("ai-response");
    resp.textContent = "Cargando...";
    GAS.preguntarIA(preg, LIQUIDACION_ID || "current").then(function(text) {
      resp.textContent = text;
      hideLoading();
    }).catch(function(e) {
      resp.textContent = "Error: " + e.message;
      hideLoading();
    });
  });
}

async function loadBitacora() {
  if (!LIQUIDACION_ID) return;
  GAS.obtenerBitacora(LIQUIDACION_ID).then(function(entries) {
    var el = document.getElementById('lista-bitacora');
    if (entries.length === 0) {
      el.innerHTML = '<p style="color:#9aa0a6;font-size:.85rem;text-align:center">Sin notas registradas</p>';
      return;
    }
    el.innerHTML = entries.slice().reverse().map(function(e) {
      var botonConvertir = '';
      if (!e.convertidoAGasto) {
        botonConvertir = ' <button style="font-size:.7rem;background:var(--accent);color:#fff;border:none;border-radius:4px;padding:2px 6px;cursor:pointer" onclick="convertirBitacora(\'' + e.id + '\')">Convertir en gasto</button>';
      } else {
        botonConvertir = ' <span style="font-size:.7rem;color:var(--positive)">\u2705 Convertido</span>';
      }
      var linea = '<div class="expense-item">' +
        '<div><div class="desc">' + escapeHtml(e.nota) +
        (e.montoOpcional ? ' <span class="cat">$'+ e.montoOpcional.toLocaleString("es-CO") +'</span>' : '') +
        '</div><div class="cat">' + escapeHtml(e.fecha) + botonConvertir + '</div></div></div>';
      return linea;
    }).join('');
  }).catch(function(e) {
    toast("Error al cargar bitácora: " + e.message, "error");
  });
}

async function agregarBitacora() {
  var nota = document.getElementById('bitacora-nota').value.trim();
  var monto = parseFloat(document.getElementById('bitacora-monto').value) || 0;
  if (!nota) return toast('Ingrese una nota', 'error');
  if (!LIQUIDACION_ID) return toast('Abra un viaje primero', 'error');
  try {
    await GAS.agregarBitacora(LIQUIDACION_ID, nota, monto);
    document.getElementById('bitacora-nota').value = '';
    document.getElementById('bitacora-monto').value = '';
    _cachedResumen = null;
    loadBitacora();
  } catch (e) {
    toast('Error al agregar nota: ' + e.message, 'error');
  }
}

function convertirBitacora(id) {
  var categoria = prompt("Categoría para el gasto (Diario, ACPM, Peajes, Comision, Coteros, Descargue, Envarillada, Manifiesto, Mantenimiento, Otro):", "Otro");
  if (!categoria) return;
  if (!confirm('Convertir esta nota en gasto con categoría "' + categoria + '"?')) return;
  GAS.convertirBitacoraAGasto(id, categoria).then(function() {
    _cachedResumen = null;
    loadBitacora();
    loadGastos();
    loadResumen();
    toast('Nota convertida en gasto', 'success');
  }).catch(function(e) {
    toast('Error: ' + e.message, 'error');
  });
}

function loadComparar() {
  var grid = document.getElementById("compare-grid");
  grid.innerHTML = '<p style="color:#5f6368;text-align:center;font-size:.9rem">Cargando viajes...</p>';
  GAS.listarLiquidaciones().then(function(viajes) {
    if (viajes.length < 2) {
      grid.innerHTML = '<p style="color:#5f6368;text-align:center;font-size:.9rem">Necesita al menos 2 viajes cerrados para comparar</p>';
      return;
    }
    var opts = viajes.map(function(v) {
      return '<option value="' + v.id + '">' + escapeHtml(v.placa) + ' - ' + v.fechaInicio + ' ($' + (v.balance || 0).toLocaleString("es-CO") + '</option>';
    }).join("");
    grid.innerHTML =
      '<div class="form-group"><label>Viaje A</label><select id="cmp-a" class="form-control">' + opts + '</select></div>' +
      '<div class="form-group"><label>Viaje B</label><select id="cmp-b" class="form-control">' + opts + '</select></div>' +
      '<button class="btn btn-primary" id="btn-comparar">Comparar</button>' +
      '<div id="cmp-result" style="margin-top:12px"></div>';
    document.getElementById("btn-comparar").addEventListener("click", function() {
      var idA = document.getElementById("cmp-a").value;
      var idB = document.getElementById("cmp-b").value;
      if (idA === idB) return toast("Seleccione dos viajes distintos", "error");
      GAS.comparar(idA, idB).then(function(res) {
        var d = document.getElementById("cmp-result");
        var balClsA = res.balanceA >= 0 ? "" : "negative";
        var balClsB = res.balanceB >= 0 ? "" : "negative";
        var signA = res.balanceA >= 0 ? "+" : "";
        var signB = res.balanceB >= 0 ? "+" : "";
        d.innerHTML =
          '<div class="compare-grid">' +
          '<div class="compare-card ' + balClsA + '"><div class="label">Viaje ' + escapeHtml(String(res.idA)) + '</div><div class="val">$' + signA + res.balanceA.toLocaleString("es-CO") + '</div><div class="label">Balance</div></div>' +
          '<div class="compare-card ' + balClsB + '"><div class="label">Viaje ' + escapeHtml(String(res.idB)) + '</div><div class="val">$' + signB + res.balanceB.toLocaleString("es-CO") + '</div><div class="label">Balance</div></div>' +
          '</div>';
      }).catch(function() {
        d.innerHTML = '<p style="color:var(--negative)">Error al comparar</p>';
      });
    });
  }).catch(function() {
    grid.innerHTML = '<p style="color:#5f6368;text-align:center;font-size:.9rem">No hay viajes para comparar</p>';
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
